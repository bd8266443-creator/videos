<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>

    <!-- X Player Card Tags -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:title" content="Watch Video" />
    <meta name="twitter:description" content="Click to play the full-length video clip." />
    <meta name="twitter:image" content="https://github.io" />
    <meta name="twitter:player" content="https://github.io" />
    <meta name="twitter:player:width" content="1280" />
    <meta name="twitter:player:height" content="720" />

    <style>
        /* Removes browser margins and sets up a black backdrop */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Forces the video element to stretch perfectly across the canvas */
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Keeps your video aspect ratio correct without stretching pixels */
        }
    </style>
</head>
<body>
    <!-- The native player handling your streaming link directly -->
    <video controls poster="thumbnail.jpg" autoplay muted playsinline>
        <source src="https://media.githubusercontent.com/media/bd8266443-creator/videos/main/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>
</html>
